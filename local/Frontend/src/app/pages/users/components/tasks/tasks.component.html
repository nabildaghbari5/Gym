<app-breadcrumbs title="Mes tâches" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="row">
  <div class="col-lg-12">
    <div class="card" id="tasksList">
      <div class="card-body">
        <div class="row align-items-center g-2">
          <div class="col-lg-3 me-auto">
            <h6 class="card-title mb-0">
              Mes tâches
              <span class="badge bg-primary ms-1 align-baseline">{{ tasks.length }}</span>
            </h6>
          </div>
        </div>
      </div>

      <div class="card-body">
        <div class="table-responsive table-card">
          <table class="table table-centered align-middle table-custom-effect table-nowrap mb-0">
            <thead class="text-muted">
              <tr>
                <th>Client</th>
                <th>Process</th>
                <th>Region</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody class="list form-check-all">
              <tr *ngFor="let task of tasks; trackBy: trackById">
                <td>{{ task.clientName }} <br> {{ task.company }}</td>
                <td>{{ task.process }} <br> Code: {{ task.code }}</td>
                <td>{{ task.region }} <br> {{ task.subregion }}</td>
                <td>
                  <div class="d-flex align-items-center">
                    <span>{{ task.progress }}%</span>
                    <div class="progress ms-2 flex-grow-1">
                        <div class="progress-bar" [style.width]="task.progress + '%'" [ngClass]="getProgressClass(task.progress)"></div>
                    </div>
                  </div>
                  <span>{{ task.status }}</span>
                </td>
                <td>
                  <ul class="d-flex gap-2 list-unstyled mb-0">
                    <li>
                      <a class="btn btn-subtle-primary btn-icon btn-sm">
                        <i class="ph-eye"></i>
                      </a>
                    </li>
                    <li>
                      <a href="javascript:void(0);" class="btn btn-subtle-secondary btn-icon btn-sm edit-item-btn">
                        <i class="ph-pencil"></i>
                      </a>
                    </li>
                    <li>
                      <a href="javascript:void(0);" class="btn btn-subtle-danger btn-icon btn-sm remove-item-btn">
                        <i class="ph-trash"></i>
                      </a>
                    </li>
                  </ul>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
